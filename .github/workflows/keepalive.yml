# GitHub disables scheduled workflows in public repos after 60 days without
# commits. This monthly no-op commit keeps the uptime cron alive.
name: Keepalive

on:
  schedule:
    - cron: "0 4 1 * *"   # monthly, 1st 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive file
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" && git push
